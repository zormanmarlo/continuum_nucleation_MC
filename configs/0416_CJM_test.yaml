# =============================================================================
# COMPLETE CONFIGURATION FILE TEMPLATE
# Monte Carlo Nucleation Simulation - All Possible Parameters
# =============================================================================

# =============================================================================
# SYSTEM SIZE PARAMETERS
# Note: Must specify at least 2 of these 3 parameters. The third will be calculated.
# =============================================================================
ratio: "1:0"
num_particles: 512
box_length: 257.13569255877858081694
concentration: 0.050        # Molar concentration of salt solution

# =============================================================================
# SIMULATION CONTROL PARAMETERS
# =============================================================================
equil_steps: 1000       # Number of equilibration steps
prod_steps: 4000        # Number of production steps
output_interval: 2      # Steps between output file writes
internal_interval: 1    # Steps between internal adjustments (displacement tuning)
seed: 42                # Random number generator seed
n_rosenbluth_trials: 1
output_detailed_balance: False
output_rcut: False
output_rcut_traj: False

# =============================================================================
# THERMODYNAMIC PARAMETERS
# =============================================================================
# LJ SETTINGS
# run at 80.7 Kelvin
kT: 0.159248
# cutoff is 6.75*sigma
energy_cutoff: 22.98375
#epsilon: 0.2385205545
epsilon: 0.0
sigma: 3.405

# BIAS SETTINGS
bias_type: linear
max_target: 20
#bias_file: bias/bias_50mM_US_30.txt

# =============================================================================
# MONTE CARLO MOVE RATES
# Note: Only moves with rate > 0 will be active. Rates are automatically normalized.
# AVBMC and NVT rates are automatically split 50/50 between in→out and out→in moves.
# =============================================================================
translation_rate: 0.0       # Rate for random translation moves
swap_rate: 0.0              # Rate for particle swap/repositioning moves
avbmc_rate: 0.0             # Rate for AVBMC (Aggregation-Volume-Bias) moves
nvt_rate: 1.0
max_displacement: 10.0      # Maximum displacement distance for translations (Angstroms)

# =============================================================================
# CLUSTER ANALYSIS PARAMETERS
# =============================================================================
upper_bonded_cutoff: 10.0
#lower_bonded_cutoff: 2.5
lower_bonded_cutoff: 0.0
clust_cutoff: 10.0

# =============================================================================
# INPUT/OUTPUT FILE PARAMETERS
# =============================================================================
input_path: null   # Initial config file (relative to inputs/ dir, null for random) - Default: null
